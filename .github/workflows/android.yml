name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Signing keys never live in a public repository. If the owner adds the
      # four secrets below, the release is signed here; otherwise it is built
      # unsigned and `scripts/sign-release.sh` finishes the job locally.
      - name: Import keystore if the owner supplied one
        env:
          KEYSTORE_B64: ${{ secrets.TOOLZ_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TOOLZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOOLZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOOLZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/toolz-upload.jks"
            {
              echo "TOOLZ_KEYSTORE_PATH=$RUNNER_TEMP/toolz-upload.jks"
              echo "TOOLZ_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "TOOLZ_KEY_ALIAS=$KEY_ALIAS"
              echo "TOOLZ_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release will be signed with the owner's upload key."
          else
            echo "No signing secrets — building an unsigned release, as documented."
          fi

      - name: Build
        run: |
          set -o pipefail
          gradle \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon --stacktrace --warning-mode=summary \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-build.log"

      - name: Collect artefacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist ci
          cp "$GITHUB_WORKSPACE/ci-build.log" ci/build.log || true
          tail -n 400 ci/build.log > ci/build-tail.log || true
          : > dist/SHA256SUMS.txt
          copy() {
            if [ -f "$1" ]; then
              cp "$1" "dist/$2"
              ( cd dist && sha256sum "$2" >> SHA256SUMS.txt )
            fi
          }
          copy app/build/outputs/bundle/release/app-release.aab toolz-1.0.0.aab
          copy app/build/outputs/apk/release/app-release.apk toolz-1.0.0.apk
          copy app/build/outputs/apk/release/app-release-unsigned.apk toolz-1.0.0-unsigned.apk
          copy app/build/outputs/apk/debug/app-debug.apk toolz-1.0.0-debug.apk
          ls -l dist
          find app/build/outputs -maxdepth 3 -type d 2>/dev/null | head -20

      # Check-run annotations are readable through the API even when the runner
      # token cannot push, so they are the reliable way to surface build errors.
      - name: Annotate build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          path = "ci/build.log"
          if not os.path.exists(path):
              print("::error::No build log was produced at all.")
              raise SystemExit(0)
          lines = open(path, errors="ignore").read().splitlines()
          keep = [l for l in lines if re.search(r"(^e: |^w: .*error|error:|FAILURE:|What went wrong|Execution failed for task|Caused by:|> Task .* FAILED|Unresolved reference|error: )", l)]
          interesting = keep[:14] if keep else lines[-14:]
          for line in interesting:
              print("::error::" + line.strip()[:880])
          tail = "\n".join(lines[-25:])
          print("::error::TAIL " + tail.replace("\n", " | ")[:880])
          PY

      # Everything below is emitted as check-run annotations because the runner
      # token in this repository is read-only: annotations are the only channel
      # that survives out of the job.
      - name: Verify the artefacts
        if: always()
        run: |
          emit() { printf '%s\n' "::warning::$1" | cut -c1-900; }
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 2>/dev/null | sort | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort | tail -1)

          if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0)); failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0)); skipped += int(root.get("skipped", 0))
          print(f"::warning::JVM TESTS: {tests} run, {failures} failed, {errors} errors, {skipped} skipped")
          PY
          else
            emit "JVM TESTS: no test results were produced"
          fi

          if [ -n "$AAPT2" ] && [ -f dist/toolz-1.0.0-debug.apk ]; then
            "$AAPT2" dump badging dist/toolz-1.0.0-debug.apk 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission)" | head -8 | while read -r line; do emit "BADGING $line"; done
          fi

          if [ -f dist/toolz-1.0.0.aab ]; then
            emit "AAB entries: $(unzip -l dist/toolz-1.0.0.aab 2>/dev/null | tail -1 | awk '{print $2}') files"
            unzip -l dist/toolz-1.0.0.aab 2>/dev/null | grep -E "base/(manifest|resources.pb|dex/classes|res/)" | head -4 | awk '{print $4}' | while read -r line; do emit "AAB has $line"; done
            emit "AdMob app id in manifest: $(unzip -p dist/toolz-1.0.0.aab base/manifest/AndroidManifest.xml 2>/dev/null | strings | grep -c 'ca-app-pub-5010473500037610' || true) match(es)"
            emit "AAB sha256: $(sha256sum dist/toolz-1.0.0.aab | cut -d' ' -f1)"
          else
            emit "AAB: not produced"
          fi

          for apk in dist/toolz-1.0.0.apk dist/toolz-1.0.0-debug.apk; do
            [ -f "$apk" ] || continue
            emit "$(basename "$apk") sha256: $(sha256sum "$apk" | cut -d' ' -f1) size $(stat -c%s "$apk")"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk" 2>&1 | grep -E "^(Signer #1 certificate DN|Number of signers|DOES NOT VERIFY)" | while read -r line; do emit "$(basename "$apk") $line"; done
            fi
          done

      - name: Publish build output to the pull request branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "toolz-ci"
          git config user.email "ci@toolz.name.ng"
          git add -A android/dist android/ci
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "ci: android build output [skip ci]"
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${{ github.head_ref || github.ref_name }}" 2>push.err; then
            echo "Pushed the artefacts."
            exit 0
          fi
          echo "::error::PUSH FAILED: $(tr '\n' ' ' < push.err | head -c 700)"
          # Second channel: a pull-request comment we can read through the API.
          if gh pr comment "${{ github.event.pull_request.number }}" --body "Build finished. Artefact publish failed: $(head -c 300 push.err)" 2>comment.err; then
            echo "::warning::PR COMMENT CHANNEL WORKS"
          else
            echo "::error::COMMENT FAILED: $(tr '\n' ' ' < comment.err | head -c 500)"
          fi
          # Third channel: a direct contents API write.
          if echo "probe" | base64 > blob.txt && gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/android/ci/probe.txt" -f message="ci probe" -f content="$(cat blob.txt)" 2>api.err; then
            echo "::warning::CONTENTS API CHANNEL WORKS"
          else
            echo "::error::API FAILED: $(tr '\n' ' ' < api.err | head -c 500)"
          fi
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolz-apk
          path: android/dist/*.apk
          if-no-files-found: warn

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolz-aab
          path: android/dist/*.aab
          if-no-files-found: warn
