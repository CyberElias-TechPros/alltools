name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release bundle (unsigned without signing secrets)
        if: github.event_name != 'pull_request'
        run: gradle :app:bundleRelease --no-daemon
        env:
          TOOLZ_KEYSTORE_PATH: ${{ secrets.TOOLZ_KEYSTORE_PATH }}
          TOOLZ_KEYSTORE_PASSWORD: ${{ secrets.TOOLZ_KEYSTORE_PASSWORD }}
          TOOLZ_KEY_ALIAS: ${{ secrets.TOOLZ_KEY_ALIAS }}
          TOOLZ_KEY_PASSWORD: ${{ secrets.TOOLZ_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toolz-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: toolz-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
